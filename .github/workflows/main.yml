name: Build Android ARM64
run-name: Build Android ARM64 (${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'release' }})

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Android build mode (both use the same signing key)
        type: choice
        options: [release, debug]
        default: release
        required: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'release' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The release tag and the `pubspec.yaml` semantic version are one fact
      # maintained in one place. A mismatch fails here, before the signing
      # secrets and the build, so a wrong tag can never publish assets.
      # `workflow_dispatch` runs are manual debug/release builds and are exempt.
      - name: Verify release tag matches pubspec version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.search(
              r'^version:\s*(\S+)',
              Path('pubspec.yaml').read_text(),
              re.M,
          ).group(1)
          semantic_version = version.split('+')[0]
          expected_tag = f'v{semantic_version}'
          tag = os.environ['RELEASE_TAG']
          if tag != expected_tag:
              raise SystemExit(
                  f'Release tag {tag!r} does not match pubspec.yaml '
                  f'{version!r}: expected {expected_tag!r}. Bump version: in '
                  'pubspec.yaml and merge it to master before publishing.'
              )
          print(f'Release tag {tag} matches pubspec.yaml {version}')
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true

      - name: Select Java 17 for Flutter
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Check Rust toolchain
        run: rustup show

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Restore shared Android signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE" || -z "$ANDROID_KEY_PROPERTIES" ]]; then
            echo '::error::Configure ANDROID_KEYSTORE and ANDROID_KEY_PROPERTIES in repository Actions secrets.'
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          # Resolve storeFile relative to android/app, independently of local paths.
          printf '\nstoreFile=../keystore.jks\n' >> android/key.properties

      - name: Build Android ARM64 APK
        run: flutter build apk --${BUILD_MODE} --target-platform android-arm64

      - name: Collect and verify ARM64 APK
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os
          import re
          import shutil
          import zipfile
          from pathlib import Path

          mode = os.environ['BUILD_MODE']
          version = re.search(r'^version:\s*(\S+)', Path('pubspec.yaml').read_text(), re.M).group(1)
          # `pubspec.yaml` carries the single real version source as
          # `<semantic version>+<build number>`. The build number stays in the
          # package metadata and in the derived Android versionCode, but the
          # release asset name is the semantic version alone, so a pure
          # build-number bump never changes the published file name.
          semantic_version = version.split('+')[0]
          apk = Path(f'build/app/outputs/flutter-apk/app-{mode}.apk')
          with zipfile.ZipFile(apk) as archive:
              abis = {name.split('/')[1] for name in archive.namelist()
                      if name.startswith('lib/') and name.endswith('.so')}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Expected only arm64-v8a native libraries, got {sorted(abis)}')
          shutil.copyfile(apk, f'dist/venera-{semantic_version}-android-arm64-{mode}.apk')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-${{ env.BUILD_MODE }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing files
        if: always()
        run: rm -f android/keystore.jks android/key.properties

  publish:
    if: github.event_name == 'release'
    needs: build_android
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-arm64-release
          path: dist
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.apk --clobber
